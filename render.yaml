services:
  - type: web
    name: excel-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: LANG
        value: "en_US.UTF-8"
      - key: LC_ALL
        value: "en_US.UTF-8"
